<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0C" />
<title>Ficha de Salud — Z Fitness</title>
<link rel="icon" type="image/png" href="favicon-z-fit.png?v=3" />
<meta name="robots" content="noindex" />
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg-base:#0A0A0C; --bg-card:#15151C;
  --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
  --text-primary:#F5F4F1; --text-secondary:rgba(245,244,241,0.70); --text-tertiary:rgba(245,244,241,0.45);
  --accent:#FFFFFF;
  --radius-lg:20px; --radius-pill:999px;
  --font-display:'Bricolage Grotesque',sans-serif; --font-body:'DM Sans',sans-serif;
  --gutter:clamp(20px,5vw,80px);
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-body);font-size:1rem;line-height:1.7;-webkit-font-smoothing:antialiased;}
a{color:var(--text-primary);text-decoration:underline;text-underline-offset:3px;transition:opacity 160ms;}
a:hover{opacity:0.7;}

/* Nav */
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px var(--gutter);border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,12,0.9);backdrop-filter:blur(14px);z-index:10;}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-primary);}
.logo img{width:36px;height:36px;border-radius:10px;}
.logo-name{font-family:var(--font-display);font-weight:700;font-size:1.05rem;}
.back-link{font-size:0.875rem;color:var(--text-secondary);text-decoration:none;display:flex;align-items:center;gap:6px;transition:color 160ms;}
.back-link:hover{color:var(--text-primary);opacity:1;}

/* Layout */
.page{width:100%;max-width:1024px;margin:0 auto;padding:20px 16px 80px;}

/* Header */
.page-header{margin:32px 0 28px;}
.page-header h1{font-family:var(--font-display);font-size:clamp(1.75rem,4vw,2.5rem);font-weight:800;line-height:1.15;margin-bottom:12px;}
.page-header p{color:var(--text-secondary);font-size:0.9375rem;}

/* Contenedor del formulario */
.form-wrap{width:100%;max-width:1024px;margin:0 auto;padding:20px 0;}
.form-frame-box{background:#1A1A1A;border:1px solid var(--border);border-radius:20px;padding:16px;height:auto;}
.form-frame-box iframe{display:block;width:100%;border-radius:12px;background:#1A1A1A;}

@media (min-width:768px){
  .form-frame-box{padding:32px;}
}

/* Footer */
.foot{padding:32px var(--gutter);border-top:1px solid var(--border);text-align:center;color:var(--text-tertiary);font-size:0.8125rem;margin-top:40px;}
.foot a{color:var(--text-tertiary);}
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="logo">
    <img src="logo.webp" alt="Z Fitness" />
    <span class="logo-name">Z Fitness</span>
  </a>
  <a href="/" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Volver al sitio
  </a>
</nav>

<main class="page">

  <header class="page-header">
    <h1>Ficha de Salud</h1>
    <p>Completa este formulario antes de tu primera clase en Z Fitness.</p>
  </header>

  <div class="form-wrap">
    <div class="form-frame-box">
      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSc2pNER3l_kjfxpZiz097gAi7CKJm8v_gDGWYlpQPnMIJrbrw/viewform?embedded=true"
        width="100%"
        height="3500"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        scrolling="no"
        style="border: none; overflow: hidden; min-height: 3500px;"
        title="Ficha de Salud — Z Fitness">Cargando formulario…</iframe>
    </div>
  </div>

</main>

<footer class="foot">
  <p>© 2026 Z Fitness · Todos los derechos reservados.</p>
</footer>

</body>
</html>
